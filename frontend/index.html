    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Digitelio AI",
        "url": "https://digitelio.com/",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web",
        "description": "Plateforme pour créer des eBooks et des formations avec l'IA, en 7 langues.",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "XOF" }
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      // Applique le thème avant le rendu pour éviter le flash (FOUC)
      (function () {
        const saved = localStorage.getItem("digitelio-theme");
        const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        const theme = saved || (prefersDark ? "dark" : "dark");
        if (theme === "dark") document.documentElement.classList.add("dark");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <h1>Digitelio AI</h1>

        Créez des eBooks et des formations premium avec l'IA, en 7 langues, avec 12 modèles prêts à
        exporter en PDF. Activez JavaScript pour utiliser Digitelio AI.
      </p>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
